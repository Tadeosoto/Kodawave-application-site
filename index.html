<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caenna Mechanical Engineering</title>
    <meta
      name="description"
      content="Caenna mechanical engineering practice."
    />
    <meta name="theme-color" content="#e2dbd6" />
    <!-- Archivos en /public. ?v= rompe caché agresiva del favicon en el navegador. -->
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=4" />
    <link rel="manifest" href="/site.webmanifest?v=4" />

    <!-- LCP del Home: silueta del bloque de marca Caenna. Preload temprano (AVIF + WebP fallback)
         para que la descarga arranque en paralelo con CSS/JS, no después del bundle. -->
    <link
      rel="preload"
      as="image"
      href="/lcp/mono-jade-960.avif"
      type="image/avif"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/lcp/mono-jade-960.webp"
      type="image/webp"
    />

    <link rel="canonical" href="https://example.com/" />
    <meta property="og:title" content="Caenna Mechanical Engineering" />
    <meta
      property="og:description"
      content="Mechanical engineering practice CAD DFM analysis and prototypes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Caenna Mechanical Engineering" />
    <meta
      name="twitter:description"
      content="Mechanical engineering practice CAD DFM analysis and prototypes."
    />
  </head>
  <body
    id="top"
    style="margin:0;min-height:100vh;background-color:#e2dbd6;color:#2a2620"
  >
    <!-- Placeholder neutro: pinta antes del bundle (FCP estable) y no desplaza layout
         cuando React monta porque ocupa la misma caja vertical y se reemplaza al instante. -->
    <div id="root">
      <div
        aria-hidden="true"
        style="min-height:100vh;background-color:#e2dbd6"
      ></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
